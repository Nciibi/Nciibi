name: GitHub Readme Stats

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=midnight-purple&include_all_commits=true&count_private=true&hide_border=true
          path: .github/assets/stats.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          PAT_1: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          PAT: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/assets/stats.svg
          git commit -m "Update README cards" || exit 0
          git pull --rebase origin main
          git push